<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFTV | Room of Faith</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #94a3b8; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .upvoted { color: #ffffff !important; }
        #toast { transition: transform 0.3s ease, opacity 0.3s ease; }
        #confessionModal { transition: opacity 0.25s ease, transform 0.25s ease; }
        #confessionModal.hidden-modal { opacity: 0; pointer-events: none; transform: scale(0.95); }
        #confessionModal.show-modal { opacity: 1; pointer-events: auto; transform: scale(1); }
    </style>
</head>
<body class="scrollbar-hide">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-white text-black text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300">
        ✨ Pengakuan berhasil dikirim!
    </div>

    <!-- Floating Action Button (FAB) untuk membuka Pop-up Form -->
    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="toggleModal(true)" class="flex items-center gap-2 bg-white text-black px-4 py-3 rounded-full shadow-2xl hover:bg-slate-200 active:scale-95 transition-all font-black text-xs">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
            <span class="hidden sm:inline tracking-wide">TULIS PENGAKUAN</span>
        </button>
    </div>

    <!-- POP-UP MODAL FORM -->
    <div id="confessionModal" class="hidden-modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
        <div class="glass w-full max-w-md p-6 rounded-3xl border border-white/10 shadow-2xl relative bg-[#0a0a0a]">
            <!-- Tombol Close Modal -->
            <button onclick="toggleModal(false)" class="absolute top-5 right-5 text-slate-400 hover:text-white p-1 rounded-full hover:bg-white/5 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <h2 class="text-base font-black text-white mb-4 tracking-tight">Sampaikan Pengakuan</h2>

            <form id="confessionForm" class="space-y-3">
                <input type="text" id="alias" placeholder="Alias..." class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition">
                
                <div class="relative">
                    <textarea id="confession" rows="4" maxlength="300" placeholder="Tulis pengakuanmu di sini..." oninput="updateCharCount()" class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition resize-none"></textarea>
                    <div id="charCount" class="absolute bottom-3 right-3 text-[10px] text-slate-600 font-mono">0/300</div>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full py-3 bg-white text-black text-xs font-black rounded-xl hover:bg-slate-200 active:scale-[0.98] transition-all shadow-lg">SUBMIT PENGAKUAN</button>
            </form>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-30 bg-[#050505]/80 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-lg mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="flex items-center active:scale-95 transition-transform">
                <img src="assets/PDFTV-white.webp" alt="PDFTV Logo" class="h-6 w-auto">
            </a>
            <div class="text-[9px] font-mono uppercase tracking-[0.2em] text-slate-700 border border-slate-800 px-2 py-0.5 rounded-full">Room.Faith</div>
        </div>
    </nav>

    <main class="pt-20 px-4 pb-12 max-w-lg mx-auto">
        <!-- Section Header -->
        <section class="text-center mb-5">
            <h1 class="text-xl font-black mb-1 tracking-tight text-white">Room of Faith</h1>
            <p class="text-slate-500 text-[10px] italic">"If every moment mattered, would it still be like this?"</p>
            <p class="text-slate-700 text-[8px] mt-0.5 uppercase tracking-widest font-bold">- zaldnielsen</p>
        </section>

        <!-- IMAGE SLIDER SECTION -->
        <section class="relative w-full mb-6 overflow-hidden rounded-2xl glass border border-white/10 shadow-2xl group">
            <div id="slider" class="flex transition-transform duration-500 ease-out w-full">
                <!-- Slide 1 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider01_roster.webp" alt="Slider Image 1" class="w-full h-full object-cover">
                </div>
                <!-- Slide 2 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider02_mixtape.webp" alt="Slider Image 2" class="w-full h-full object-cover" loading="lazy">
                </div>
                <!-- Slide 3 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider03_social.webp" alt="Slider Image 3" class="w-full h-full object-cover" loading="lazy">
                </div>
            </div>

            <!-- Navigasi Slider -->
            <button onclick="prevSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white p-1.5 rounded-full backdrop-blur-sm transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="nextSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white p-1.5 rounded-full backdrop-blur-sm transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Dots Slider -->
            <div class="absolute bottom-2 right-3 flex gap-1 z-10">
                <button onclick="goToSlide(0)" class="dot-btn w-3 h-1.5 rounded-full bg-white transition-all duration-300 opacity-100"></button>
                <button onclick="goToSlide(1)" class="dot-btn w-1.5 h-1.5 rounded-full bg-white transition-all duration-300 opacity-40"></button>
                <button onclick="goToSlide(2)" class="dot-btn w-1.5 h-1.5 rounded-full bg-white transition-all duration-300 opacity-40"></button>
            </div>
        </section>

        <!-- Filter Sort -->
        <div class="mb-4">
            <select id="sortSelect" onchange="sortFeed()" class="bg-black/50 border border-white/10 text-white text-[10px] p-2.5 rounded-xl focus:outline-none uppercase tracking-widest w-full cursor-pointer">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="upvotes">Upvote Terbanyak</option>
                <option value="comments">Komentar Terbanyak</option>
            </select>
        </div>

        <!-- SWIPE / TINDER CARD FEED CONTAINER -->
        <div id="swipeContainer" class="relative w-full select-none touch-pan-y">
            <div id="feed" class="w-full transition-all duration-200 ease-out"></div>
        </div>
        
        <!-- Desktop Friendly Navigation Buttons & Subtle Hint -->
        <div class="flex items-center justify-between mt-4 px-1">
            <button onclick="prevCard()" class="p-2.5 glass rounded-xl border border-white/10 text-white/70 hover:text-white hover:bg-white/10 transition active:scale-90 flex items-center gap-1.5 text-[10px] font-mono">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Sebelumnya
            </button>
            <p class="text-[9px] text-slate-600 font-mono tracking-widest uppercase text-center hidden sm:block">‹ Geser / Tombol ›</p>
            <button onclick="nextCard('right')" class="p-2.5 glass rounded-xl border border-white/10 text-white/70 hover:text-white hover:bg-white/10 transition active:scale-90 flex items-center gap-1.5 text-[10px] font-mono">
                Selanjutnya
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </main>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = 'https://fhpyvnbsreoaiaeqfkvk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_aSPwcLUMW2y7r3nk6cpBpg_3DJH5sky';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const TABLE_NAME = 'PDFTV Room of Faith';

        // --- MODAL TOGGLE ---
        function toggleModal(open) {
            const modal = document.getElementById('confessionModal');
            if (open) {
                modal.classList.remove('hidden-modal');
                modal.classList.add('show-modal');
            } else {
                modal.classList.remove('show-modal');
                modal.classList.add('hidden-modal');
            }
        }

        // --- HELPER SECURITY & TIME ---
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function timeAgo(timestamp) {
            const now = Date.now();
            const seconds = Math.floor((now - timestamp) / 1000);
            
            if (isNaN(seconds) || seconds < 0) return 'baru saja';
            if (seconds < 60) return `${seconds}d yang lalu`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m yang lalu`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}j yang lalu`;
            const days = Math.floor(hours / 24);
            return `${days}hr yang lalu`;
        }

        // --- LOGIKA SLIDER GAMBAR ATAS ---
        let currentSlide = 0;
        const totalSlides = 3;
        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot-btn');
        let slideInterval;

        function updateSliderUI() {
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.classList.remove('opacity-40', 'w-1.5');
                    dot.classList.add('opacity-100', 'w-3');
                } else {
                    dot.classList.remove('opacity-100', 'w-3');
                    dot.classList.add('opacity-40', 'w-1.5');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSliderUI();
            resetTimer();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateSliderUI();
            resetTimer();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSliderUI();
            resetTimer();
        }

        function startTimer() { slideInterval = setInterval(nextSlide, 3500); }
        function resetTimer() { clearInterval(slideInterval); startTimer(); }
        startTimer();

        // --- APP LOGIC & INFINITE SWIPE DECK ---
        let posts = [];
        let currentIndex = 0;
        const form = document.getElementById('confessionForm');
        const feed = document.getElementById('feed');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 10px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 3000);
        }

        function updateCharCount() {
            const textLength = document.getElementById('confession').value.length;
            document.getElementById('charCount').textContent = `${textLength}/300`;
        }

        async function fetchPosts() {
            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('*');

                if (error) throw error;
                
                posts = (data || []).map((row) => {
                    let parsedComments = [];
                    if (row.comments) {
                        try {
                            parsedComments = typeof row.comments === 'string' ? JSON.parse(row.comments) : row.comments;
                        } catch (e) {
                            parsedComments = [];
                        }
                    }

                    const rawTime = row.id; 
                    const parsedTime = isNaN(Number(rawTime)) ? Date.now() : Number(rawTime);

                    return {
                        id: String(row.id),
                        alias: row.alias || 'Anonymous',
                        text: row.confession || '',
                        upvotes: Number(row.upvotes) || 0,
                        comments: Array.isArray(parsedComments) ? parsedComments : [],
                        timestamp: parsedTime
                    };
                });

                sortFeed();
            } catch (error) {
                console.error('Gagal memuat data:', error);
                feed.innerHTML = `<div class="text-center text-slate-600 text-xs py-10 italic">Gagal memuat pengakuan dari Supabase.</div>`;
            }
        }

        fetchPosts();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const aliasInput = document.getElementById('alias');
            const confessionInput = document.getElementById('confession');
            
            const alias = aliasInput.value.trim() || 'Anonymous';
            const text = confessionInput.value.trim();
            if (!text) return;

            submitBtn.textContent = "MENGIRIM...";
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            try {
                const newId = Date.now();
                const payload = {
                    id: newId,
                    alias: alias,
                    confession: text,
                    upvotes: 0,
                    comments: JSON.stringify([])
                };

                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .insert([payload]);
                
                if (error) throw error;

                form.reset();
                updateCharCount();
                toggleModal(false); // Tutup modal otomatis setelah berhasil
                await fetchPosts();
                currentIndex = 0; 
                renderFeed();
                showToast("✨ Pengakuan berhasil dikirim!");
            } catch (error) {
                console.error('Error:', error);
                alert('Gagal mengirim pengakuan ke Supabase.');
            } finally {
                submitBtn.textContent = "SUBMIT PENGAKUAN";
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
            }
        });

        async function updatePostInSupabase(post) {
            try {
                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .update({
                        upvotes: post.upvotes,
                        comments: JSON.stringify(post.comments)
                    })
                    .eq('id', post.id);

                if (error) throw error;
            } catch (error) {
                console.error('Gagal memperbarui database Supabase:', error);
            }
        }

        function sortFeed() {
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'newest') posts.sort((a, b) => b.id - a.id);
            if (sortBy === 'oldest') posts.sort((a, b) => a.id - b.id);
            if (sortBy === 'upvotes') posts.sort((a, b) => b.upvotes - a.upvotes);
            if (sortBy === 'comments') posts.sort((a, b) => b.comments.length - a.comments.length);
            
            currentIndex = 0; 
            renderFeed();
        }

        // --- INFINITE LOOP SWIPE ENGINE ---
        function nextCard(direction = 'left') {
            if (posts.length === 0) return;
            
            feed.style.transform = direction === 'left' ? 'translateX(-30px)' : 'translateX(30px)';
            feed.style.opacity = '0';

            setTimeout(() => {
                currentIndex = (currentIndex + 1) % posts.length;
                renderFeed();
                
                feed.style.transform = direction === 'left' ? 'translateX(30px)' : 'translateX(-30px)';
                setTimeout(() => {
                    feed.style.transform = 'translateX(0)';
                    feed.style.opacity = '1';
                }, 50);
            }, 150);
        }

        function prevCard() {
            if (posts.length === 0) return;
            
            feed.style.transform = 'translateX(30px)';
            feed.style.opacity = '0';

            setTimeout(() => {
                currentIndex = (currentIndex - 1 + posts.length) % posts.length;
                renderFeed();
                
                feed.style.transform = 'translateX(-30px)';
                setTimeout(() => {
                    feed.style.transform = 'translateX(0)';
                    feed.style.opacity = '1';
                }, 50);
            }, 150);
        }

        // Touch & Mouse Swipe Listener
        let touchStartX = 0;
        let touchEndX = 0;

        const swipeContainer = document.getElementById('swipeContainer');
        
        swipeContainer.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        swipeContainer.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipeGesture();
        }, {passive: true});

        function handleSwipeGesture() {
            const threshold = 40; 
            if (touchEndX < touchStartX - threshold) {
                nextCard('left');
            } else if (touchEndX > touchStartX + threshold) {
                prevCard();
            }
        }

        function renderFeed() {
            feed.innerHTML = '';
            
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-10 glass rounded-2xl border border-white/5">
                        <p class="text-slate-500 text-xs italic">Belum ada pengakuan sama sekali.</p>
                        <p class="text-slate-600 text-[10px] mt-1">Jadilah yang pertama bersuara di ruang ini.</p>
                    </div>
                `;
                return;
            }

            const post = posts[currentIndex];
            const hasUpvoted = localStorage.getItem(`upvoted_${post.id}`) === 'true';

            const div = document.createElement('div');
            div.id = `post-card-${post.id}`;
            div.className = 'glass p-5 rounded-2xl border border-white/10 transition-all duration-300 shadow-xl';
            
            div.innerHTML = `
                <div class="flex justify-between items-center mb-4">
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-white text-[11px] uppercase tracking-wider">@${escapeHtml(post.alias)}</span>
                        <span class="text-[9px] text-slate-600 font-mono">• ${timeAgo(post.timestamp)}</span>
                    </div>
                    <button onclick="handleUpvote('${post.id}')" id="btn-${post.id}" class="flex items-center gap-1.5 text-[10px] transition active:scale-90 hover:text-white ${hasUpvoted ? 'upvoted' : 'text-slate-500'}">
                        <span class="heart">▲</span> <span id="count-${post.id}">${post.upvotes}</span>
                    </button>
                </div>
                <p class="text-slate-300 text-sm mb-5 leading-relaxed break-words">${escapeHtml(post.text)}</p>
                <div class="space-y-3">
                    <div id="replies-${post.id}" class="replyList space-y-2 text-[11px] max-h-32 overflow-y-auto scrollbar-hide">
                        ${post.comments.length > 0 ? post.comments.map(c => `<div class="text-slate-500 pl-3 border-l border-white/5 italic break-words">${escapeHtml(c)}</div>`).join('') : '<div class="text-slate-600 text-[10px] italic">Belum ada balasan.</div>'}
                    </div>
                    <input type="text" placeholder="Balas..." onkeydown="handleReply(event, '${post.id}')" class="w-full bg-black/40 border border-white/5 text-[11px] p-3 rounded-lg text-slate-300 focus:outline-none focus:border-white/20 transition">
                </div>
            `;
            feed.appendChild(div);
        }

        function handleUpvote(id) {
            if (localStorage.getItem(`upvoted_${id}`) === 'true') return;

            const post = posts.find(p => p.id === id);
            if (!post) return;

            post.upvotes += 1;
            localStorage.setItem(`upvoted_${id}`, 'true');

            const btn = document.getElementById(`btn-${id}`);
            const countSpan = document.getElementById(`count-${id}`);
            if (btn && countSpan) {
                btn.classList.add('upvoted');
                countSpan.textContent = post.upvotes;
            }

            updatePostInSupabase(post);
        }

        function handleReply(e, id) {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const text = e.target.value.trim();
                const post = posts.find(p => p.id === id);
                if (!post) return;

                post.comments.push(text);
                e.target.value = '';

                renderFeed(); 
                updatePostInSupabase(post);
                showToast("💬 Balasan terkirim!");
            }
        }
    </script>
</body>
</html>
