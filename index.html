<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFTV | Room of Faith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #94a3b8; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .upvoted { color: #ffffff !important; }
        /* Toast animation */
        #toast { transition: transform 0.3s ease, opacity 0.3s ease; }
    </style>
</head>
<body class="scrollbar-hide">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-white text-black text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none transition-all duration-300">
        ✨ Pengakuan berhasil dikirim!
    </div>

    <nav class="fixed top-0 w-full z-50 bg-[#050505]/80 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-lg mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="flex items-center active:scale-95 transition-transform">
                <img src="assets/PDFTV-white.webp" alt="PDFTV Logo" class="h-6 w-auto">
            </a>
            <div class="text-[9px] font-mono uppercase tracking-[0.2em] text-slate-700 border border-slate-800 px-2 py-0.5 rounded-full">Room.Faith</div>
        </div>
    </nav>

    <main class="pt-20 px-4 pb-20 max-w-lg mx-auto">
        <!-- Section Header (Dibuat Lebih Ringkas & Kecil) -->
        <section class="text-center mb-5">
            <h1 class="text-xl font-black mb-1 tracking-tight text-white">Room of Faith</h1>
            <p class="text-slate-500 text-[10px] italic">"If every moment mattered, would it still be like this?"</p>
            <p class="text-slate-700 text-[8px] mt-0.5 uppercase tracking-widest font-bold">- zaldnielsen</p>
        </section>

        <!-- IMAGE SLIDER SECTION (Gepeng & Tanpa Teks) -->
        <section class="relative w-full mb-6 overflow-hidden rounded-2xl glass border border-white/10 shadow-2xl group">
            <div id="slider" class="flex transition-transform duration-500 ease-out w-full">
                <!-- Slide 1 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider01_roster.webp" alt="Slider Image 1" class="w-full h-full object-cover">
                </div>
                <!-- Slide 2 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider02_mixtape.webp" alt="Slider Image 2" class="w-full h-full object-cover">
                </div>
                <!-- Slide 3 -->
                <div class="min-w-full aspect-[21/9] relative">
                    <img src="assets/slider03_social.webp" alt="Slider Image 3" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Tombol Navigasi Kiri / Kanan -->
            <button onclick="prevSlide()" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white p-1.5 rounded-full backdrop-blur-sm transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <button onclick="nextSlide()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white/70 hover:text-white p-1.5 rounded-full backdrop-blur-sm transition active:scale-95">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>

            <!-- Indikator Dot Slider -->
            <div class="absolute bottom-2 right-3 flex gap-1 z-10">
                <button onclick="goToSlide(0)" class="dot-btn w-1.5 h-1.5 rounded-full bg-white transition-all duration-300 opacity-100"></button>
                <button onclick="goToSlide(1)" class="dot-btn w-1.5 h-1.5 rounded-full bg-white transition-all duration-300 opacity-40"></button>
                <button onclick="goToSlide(2)" class="dot-btn w-1.5 h-1.5 rounded-full bg-white transition-all duration-300 opacity-40"></button>
            </div>
        </section>
        <!-- IMAGE SLIDER SECTION END -->

        <section class="glass p-5 rounded-2xl mb-8 border border-white/10 shadow-xl">
            <form id="confessionForm" class="space-y-3">
                <input type="text" id="alias" placeholder="Alias..." class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition">
                
                <div class="relative">
                    <textarea id="confession" rows="3" maxlength="300" placeholder="Sampaikan pengakuan..." oninput="updateCharCount()" class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition resize-none"></textarea>
                    <div id="charCount" class="absolute bottom-3 right-3 text-[10px] text-slate-600 font-mono">0/300</div>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full py-3 bg-white text-black text-xs font-black rounded-xl hover:bg-slate-200 active:scale-[0.98] transition-all shadow-lg">SUBMIT PENGAKUAN</button>
            </form>
        </section>

        <div class="flex items-center gap-2 mb-6">
            <select id="sortSelect" onchange="sortFeed()" class="bg-black/50 border border-white/10 text-white text-[10px] p-2.5 rounded-xl focus:outline-none uppercase tracking-widest w-full cursor-pointer">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="upvotes">Upvote Terbanyak</option>
                <option value="comments">Komentar Terbanyak</option>
            </select>
        </div>

        <div id="feed" class="space-y-6">
            <!-- Feed items or Empty state injected here -->
        </div>
    </main>

    <script>
        // --- LOGIK SLIDER INFINITE AUTO-PLAY ---
        let currentSlide = 0;
        const totalSlides = 3;
        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot-btn');
        let slideInterval;

        function updateSliderUI() {
            slider.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach((dot, idx) => {
                if (idx === currentSlide) {
                    dot.classList.remove('opacity-40');
                    dot.classList.add('opacity-100', 'w-3');
                } else {
                    dot.classList.remove('opacity-100', 'w-3');
                    dot.classList.add('opacity-40', 'w-1.5');
                }
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateSliderUI();
            resetTimer();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateSliderUI();
            resetTimer();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSliderUI();
            resetTimer();
        }

        function startTimer() {
            slideInterval = setInterval(nextSlide, 3500);
        }

        function resetTimer() {
            clearInterval(slideInterval);
            startTimer();
        }

        startTimer();

        // --- APP LOGIC (SheetDB & Feed) ---
        let posts = [];

        const form = document.getElementById('confessionForm');
        const feed = document.getElementById('feed');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');

        const SHEETDB_URL = 'https://sheetdb.io/api/v1/i8abmlp9vnlzf';

        function showToast(message) {
            toast.textContent = message;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 10px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 3000);
        }

        function updateCharCount() {
            const textLength = document.getElementById('confession').value.length;
            document.getElementById('charCount').textContent = `${textLength}/300`;
        }

        async function fetchPosts() {
            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                
                posts = data.map((row, index) => ({
                    id: row.id || Date.now() + index,
                    alias: row['data[alias]'] || row.alias || 'Anonymous',
                    text: row['data[confession]'] || row.confession || '',
                    upvotes: Number(row.upvotes) || 0,
                    comments: row.comments ? JSON.parse(row.comments) : [],
                    timestamp: row.timestamp ? Number(row.timestamp) : Date.now()
                }));

                sortFeed();
            } catch (error) {
                console.error('Gagal memuat data:', error);
                feed.innerHTML = `<div class="text-center text-slate-600 text-xs py-10 italic">Gagal memuat pengakuan. Periksa koneksi Anda.</div>`;
            }
        }

        fetchPosts();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const aliasInput = document.getElementById('alias');
            const confessionInput = document.getElementById('confession');
            
            const alias = aliasInput.value.trim() || 'Anonymous';
            const text = confessionInput.value.trim();
            if (!text) return;

            submitBtn.textContent = "MENGIRIM...";
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            try {
                const payload = {
                    data: {
                        id: String(Date.now()),
                        alias: alias,
                        confession: text,
                        upvotes: 0,
                        comments: JSON.stringify([]),
                        timestamp: Date.now()
                    }
                };

                const response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    form.reset();
                    updateCharCount();
                    fetchPosts();
                    showToast("✨ Pengakuan berhasil dikirim!");
                } else {
                    alert('Gagal mengirim pengakuan.');
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                submitBtn.textContent = "SUBMIT PENGAKUAN";
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
            }
        });

        async function updatePostInSheet(post) {
            try {
                await fetch(`${SHEETDB_URL}/id/${post.id}`, {
                    method: 'PATCH',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: {
                            upvotes: post.upvotes,
                            comments: JSON.stringify(post.comments)
                        }
                    })
                });
            } catch (error) {
                console.error('Gagal memperbarui database:', error);
            }
        }

        function sortFeed() {
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'newest') posts.sort((a, b) => b.timestamp - a.timestamp);
            if (sortBy === 'oldest') posts.sort((a, b) => a.timestamp - b.timestamp);
            if (sortBy === 'upvotes') posts.sort((a, b) => b.upvotes - a.upvotes);
            if (sortBy === 'comments') posts.sort((a, b) => b.comments.length - a.comments.length);
            renderFeed();
        }

        function renderFeed() {
            feed.innerHTML = '';
            
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-12 glass rounded-2xl border border-white/5">
                        <p class="text-slate-500 text-xs italic">Belum ada pengakuan sama sekali.</p>
                        <p class="text-slate-600 text-[10px] mt-1">Jadilah yang pertama bersuara di ruang ini.</p>
                    </div>
                `;
                return;
            }

            posts.forEach(post => {
                const hasUpvoted = localStorage.getItem(`upvoted_${post.id}`) === 'true';

                const div = document.createElement('div');
                div.className = 'glass p-5 rounded-2xl border border-white/5 transition-all duration-300 hover:border-white/10';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-white text-[11px] uppercase tracking-wider">@${post.alias}</span>
                        <button onclick="handleUpvote('${post.id}')" id="btn-${post.id}" class="flex items-center gap-1.5 text-[10px] transition active:scale-90 hover:text-white ${hasUpvoted ? 'upvoted' : 'text-slate-500'}">
                            <span class="heart">▲</span> <span class="count">${post.upvotes}</span>
                        </button>
                    </div>
                    <p class="text-slate-300 text-sm mb-5 leading-relaxed break-words">${post.text}</p>
                    <div class="space-y-3">
                        <div id="replies-${post.id}" class="replyList space-y-2 text-[11px]">
                            ${post.comments.map(c => `<div class="text-slate-500 pl-3 border-l border-white/5 italic break-words">${c}</div>`).join('')}
                        </div>
                        <input type="text" placeholder="Balas..." onkeydown="handleReply(event, '${post.id}')" class="w-full bg-black/40 border border-white/5 text-[11px] p-3 rounded-lg text-slate-300 focus:outline-none focus:border-white/20 transition">
                    </div>
                `;
                feed.appendChild(div);
            });
        }

        function handleUpvote(id) {
            const post = posts.find(p => p.id == id);
            
            if (localStorage.getItem(`upvoted_${id}`) === 'true') {
                return;
            }

            post.upvotes += 1;
            localStorage.setItem(`upvoted_${id}`, 'true');

            renderFeed();
            updatePostInSheet(post);
        }

        function handleReply(e, id) {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const post = posts.find(p => p.id == id);
                post.comments.push(e.target.value.trim());
                e.target.value = '';
                renderFeed();

                updatePostInSheet(post);
                showToast("💬 Balasan terkirim!");
            }
        }
    </script>
</body>
</html>
