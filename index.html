<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFTV | Room of Faith</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #94a3b8; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .upvoted { color: #ffffff !important; }
    </style>
</head>
<body class="scrollbar-hide">

    <nav class="fixed top-0 w-full z-50 bg-[#050505]/80 backdrop-blur-xl border-b border-white/5">
        <div class="max-w-lg mx-auto px-6 py-4 flex justify-between items-center">
            <!-- Replaced PDFTV text with the logo image and added a height constraint so it fits nicely -->
            <a href="#" class="flex items-center">
                <img src="assets/PDFTV-white.webp" alt="PDFTV Logo" class="h-6 w-auto">
            </a>
            <div class="text-[9px] font-mono uppercase tracking-[0.2em] text-slate-700 border border-slate-800 px-2 py-0.5 rounded-full">Room.Faith</div>
        </div>
    </nav>

    <main class="pt-24 px-4 pb-20 max-w-lg mx-auto">
        <section class="text-center mb-10">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tighter text-white">Room of Faith</h1>
            <p class="text-slate-500 text-[11px] italic">"If every moment mattered, would it still be like this?"</p>
            <p class="text-slate-700 text-[9px] mt-1 uppercase tracking-widest font-bold">- zaldnielsen</p>
        </section>

        <section class="glass p-5 rounded-2xl mb-8 border border-white/10">
            <form id="confessionForm" class="space-y-3">
                <input type="text" id="alias" placeholder="Alias..." class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition">
                <textarea id="confession" rows="2" placeholder="Sampaikan pengakuan..." class="w-full bg-white/5 border border-white/10 text-white text-sm p-3 rounded-xl focus:outline-none focus:border-white transition"></textarea>
                
                <button type="submit" id="submitBtn" class="w-full py-3 bg-white text-black text-xs font-black rounded-xl hover:bg-slate-200 transition">SUBMIT PENGAKUAN</button>
            </form>
        </section>

        <div class="flex items-center gap-2 mb-6 overflow-x-auto scrollbar-hide">
            <select id="sortSelect" onchange="sortFeed()" class="bg-black/50 border border-white/10 text-white text-[10px] p-2 rounded-lg focus:outline-none uppercase tracking-widest w-full">
                <option value="newest">Terbaru</option>
                <option value="oldest">Terlama</option>
                <option value="upvotes">Upvote Terbanyak</option>
                <option value="comments">Komentar Terbanyak</option>
            </select>
        </div>

        <div id="feed" class="space-y-6">
            <!-- Feed items injected here -->
        </div>
    </main>

    <script>
        let posts = [];

        const form = document.getElementById('confessionForm');
        const feed = document.getElementById('feed');
        const submitBtn = document.getElementById('submitBtn');

        const SHEETDB_URL = 'https://sheetdb.io/api/v1/i8abmlp9vnlzf';

        async function fetchPosts() {
            try {
                const response = await fetch(SHEETDB_URL);
                const data = await response.json();
                
                posts = data.map((row, index) => ({
                    id: row.id || Date.now() + index,
                    alias: row['data[alias]'] || row.alias || 'Anonymous',
                    text: row['data[confession]'] || row.confession || '',
                    upvotes: Number(row.upvotes) || 0,
                    comments: row.comments ? JSON.parse(row.comments) : [],
                    timestamp: row.timestamp ? Number(row.timestamp) : Date.now()
                }));

                posts.sort((a, b) => b.timestamp - a.timestamp);
                renderFeed();
            } catch (error) {
                console.error('Gagal memuat data:', error);
            }
        }

        fetchPosts();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const aliasInput = document.getElementById('alias');
            const confessionInput = document.getElementById('confession');
            
            const alias = aliasInput.value || 'Anonymous';
            const text = confessionInput.value;
            if (!text) return;

            submitBtn.textContent = "MENGIRIM...";
            submitBtn.disabled = true;

            try {
                const payload = {
                    data: {
                        id: String(Date.now()),
                        alias: alias,
                        confession: text,
                        upvotes: 0,
                        comments: JSON.stringify([]),
                        timestamp: Date.now()
                    }
                };

                const response = await fetch(SHEETDB_URL, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    form.reset();
                    fetchPosts();
                } else {
                    alert('Gagal mengirim pengakuan.');
                }
            } catch (error) {
                console.error('Error:', error);
            } finally {
                submitBtn.textContent = "SUBMIT PENGAKUAN";
                submitBtn.disabled = false;
            }
        });

        async function updatePostInSheet(post) {
            try {
                await fetch(`${SHEETDB_URL}/id/${post.id}`, {
                    method: 'PATCH',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        data: {
                            upvotes: post.upvotes,
                            comments: JSON.stringify(post.comments)
                        }
                    })
                });
            } catch (error) {
                console.error('Gagal memperbarui database:', error);
            }
        }

        function sortFeed() {
            const sortBy = document.getElementById('sortSelect').value;
            if (sortBy === 'newest') posts.sort((a, b) => b.timestamp - a.timestamp);
            if (sortBy === 'oldest') posts.sort((a, b) => b.timestamp - a.timestamp);
            if (sortBy === 'upvotes') posts.sort((a, b) => b.upvotes - a.upvotes);
            if (sortBy === 'comments') posts.sort((a, b) => b.comments.length - a.comments.length);
            renderFeed();
        }

        function renderFeed() {
            feed.innerHTML = '';
            posts.forEach(post => {
                const hasUpvoted = localStorage.getItem(`upvoted_${post.id}`) === 'true';

                const div = document.createElement('div');
                div.className = 'glass p-5 rounded-2xl border border-white/5 animate-in fade-in zoom-in duration-300';
                div.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-white text-[11px] uppercase tracking-wider">@${post.alias}</span>
                        <button onclick="handleUpvote('${post.id}')" id="btn-${post.id}" class="flex items-center gap-1.5 text-[10px] transition hover:text-white ${hasUpvoted ? 'upvoted' : 'text-slate-500'}">
                            <span class="heart">▲</span> <span class="count">${post.upvotes}</span>
                        </button>
                    </div>
                    <p class="text-slate-300 text-sm mb-5 leading-relaxed">${post.text}</p>
                    <div class="space-y-3">
                        <div id="replies-${post.id}" class="replyList space-y-2 text-[11px]">
                            ${post.comments.map(c => `<div class="text-slate-500 pl-3 border-l border-white/5 italic">${c}</div>`).join('')}
                        </div>
                        <input type="text" placeholder="Balas..." onkeydown="handleReply(event, '${post.id}')" class="w-full bg-black/40 border border-white/5 text-[11px] p-3 rounded-lg text-slate-300 focus:outline-none focus:border-white/20">
                    </div>
                `;
                feed.appendChild(div);
            });
        }

        function handleUpvote(id) {
            const post = posts.find(p => p.id == id);
            
            if (localStorage.getItem(`upvoted_${id}`) === 'true') {
                return;
            }

            post.upvotes += 1;
            localStorage.setItem(`upvoted_${id}`, 'true');

            renderFeed();
            updatePostInSheet(post);
        }

        function handleReply(e, id) {
            if (e.key === 'Enter' && e.target.value.trim() !== '') {
                const post = posts.find(p => p.id == id);
                post.comments.push(e.target.value);
                e.target.value = '';
                renderFeed();

                updatePostInSheet(post);
            }
        }
    </script>
</body>
</html>
