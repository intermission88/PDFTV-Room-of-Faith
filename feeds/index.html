<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room of Faith · PDFTV</title>
    <meta name="description" content="Room of Faith: ruang anonim untuk berbagi cerita, pengakuan, dan curhatan. Upvote, komentar, dan lampiran GIF.">
    <meta name="theme-color" content="#030a06">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Room of Faith · PDFTV">
    <meta property="og:description" content="Room of Faith: ruang anonim untuk berbagi cerita, pengakuan, dan curhatan. Upvote, komentar, dan lampiran GIF.">
    <meta property="og:image" content="../assets/slider01_roster.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/webp" href="../assets/PDFTV_favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,600;0,800;1,400&family=Space+Grotesk:wght@500;700;900&family=Silkscreen:wght@400;700&display=swap">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="scrollbar-hide min-h-screen flex flex-col justify-between pb-20">
    <!-- Toast Notification -->
    <div id="toast" role="status" aria-live="polite" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-white text-black text-xs font-bold px-4 py-2.5 rounded-full shadow-2xl opacity-0 pointer-events-none   whitespace-nowrap">
        ✨ Notifikasi
    </div>

    <!-- TOP HEADER WITH BGM TOGGLE & BURGER MENU -->
    <nav class="fixed top-0 w-full z-40 bg-[#030a06]/95 backdrop-blur-xl border-b border-white/[0.06] transition-all py-2.5">
        <div class="max-w-md mx-auto px-4 flex justify-between items-center relative">
            <!-- BRAND LOGO & TITLE -->
            <a href="../" class="flex items-center gap-2 active:scale-95 transition">
                <img src="../assets/PDFTV-white.webp" alt="PDFTV Logo" class="h-4 sm:h-5 w-auto">
                <span class="text-[10px] sm:text-xs font-black tracking-wider text-white uppercase font-mono-custom   pl-2">Experience</span>
            </a>

            <div class="flex items-center gap-2">
                <!-- BGM TOGGLE BUTTON (ICON ONLY) -->
                <button id="btnBgmToggle" onclick="toggleBGM()" title="Toggle BGM" aria-label="Musik latar" aria-pressed="false" class="w-10 h-10 rounded-xl bg-white/5 hover:bg-white/10   text-slate-400 hover:text-white transition active:scale-95 flex items-center justify-center">
                    <span id="bgmIcon" class="text-sm" aria-hidden="true">🎵</span>
                </button>

                <!-- BURGER MENU BUTTON -->
                <button id="btnBurgerMenu" onclick="toggleBurgerMenu()" title="Open Menu" aria-label="Menu" aria-expanded="false" aria-controls="burgerMenuDropdown" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20   text-white transition active:scale-95 flex items-center justify-center">
                    <svg class="w-4 h-4 fill-current" aria-hidden="true" viewBox="0 0 24 24">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M3 6C3 5.44772 3.44772 5 4 5H20C20.5523 5 21 5.44772 21 6C21 6.55228 20.5523 7 20 7H4C3.44772 7 3 6.55228 3 6ZM3 12C3 11.4477 3.44772 11 4 11H20C20.5523 11 21 11.4477 21 12C21 12.5523 20.5523 13 20 13H4C3.44772 13 3 12.5523 3 12ZM3 18C3 17.4477 3.44772 17 4 17H20C20.5523 17 21 17.4477 21 18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18Z" />
                    </svg>
                </button>
            </div>

            <!-- BURGER MENU DROPDOWN (EXPANDS DOWNWARD) -->
            <div id="burgerMenuDropdown" class="hidden absolute top-11 right-4 w-60 glass   rounded-2xl shadow-2xl p-2 space-y-1.5 z-50 bg-[#030a06]/95 backdrop-blur-2xl">
                <div class="px-2 py-1 text-[10px] font-mono-custom font-bold text-slate-400 uppercase tracking-wider   flex items-center justify-between">
                    <span>⚡ Quick Menu</span>
                    <span id="burgerAdminBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">Guest</span>
                </div>

                <button onclick="toggleBurgerMenu(false); toggleAdminModal(true);" class="w-full text-left p-2 rounded-xl hover:bg-white/10 text-xs font-bold text-white font-mono-custom flex items-center justify-between transition">
                    <span class="flex items-center gap-2">🔒 Admin Panel</span>
                    <span class="text-[10px] text-amber-400">Login ➔</span>
                </button>

                <div id="burgerAdminActions" class="hidden space-y-1 pt-1  ">
                    <button onclick="toggleBurgerMenu(false); handleAdminLogout();" class="w-full text-left p-2 rounded-xl bg-white/5 hover:bg-white/10 text-xs font-bold text-slate-400 font-mono-custom flex items-center gap-2 transition">
                        <span>🚪 Logout Admin / Mod</span>
                    </button>
                </div>

                <div class="pt-1   space-y-1">
                    <a href="../" onclick="toggleBurgerMenu(false)" class="w-full text-left p-2 rounded-xl hover:bg-white/10 text-xs text-slate-300 font-mono-custom flex items-center gap-2 transition">
                        <span>🏠 Home</span>
                    </a>
                    <a href="./" onclick="toggleBurgerMenu(false)" class="w-full text-left p-2 rounded-xl hover:bg-white/10 text-xs text-slate-300 font-mono-custom flex items-center gap-2 transition">
                        <span>💬 Feeds (Room of Faith)</span>
                    </a>
                    <a href="../arcade/" onclick="toggleBurgerMenu(false)" class="w-full text-left p-2 rounded-xl hover:bg-white/10 text-xs text-slate-300 font-mono-custom flex items-center gap-2 transition">
                        <span>🎰 Arcade (Balatro)</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- BOTTOM NAVBAR -->
    <div class="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 w-full max-w-md px-4">
        <div class="glass p-1 rounded-full   flex justify-between items-center shadow-2xl text-[10px] font-bold tracking-wider uppercase">
            <a href="../" class="flex-1 py-1.5 rounded-full text-slate-400 hover:text-white transition-all text-center">HOME</a>
            <a href="./" aria-current="page" class="flex-1 py-1.5 rounded-full text-white bg-white/10 transition-all text-center">FEEDS</a>
            <a href="../arcade/" class="flex-1 py-1.5 rounded-full text-slate-400 hover:text-white transition-all text-center">ARCADE</a>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <main class="px-3 pb-8 max-w-md mx-auto w-full flex-grow flex flex-col justify-center">
        <div id="viewFeeds" class="space-y-4 pt-20 pb-8 text-left">
            
            <!-- HEADER FEEDS -->
            <div class="p-4 rounded-lg bg-white/5 text-left">
                <div class="flex items-center gap-3 text-left">
                    <div class="text-lg" aria-hidden="true">💬</div>
                    <div class="text-left">
                        <h2 id="headingFeeds" tabindex="-1" class="text-base font-bold text-white text-left">Room of Faith</h2>
                        <p class="text-[11px] text-slate-400 text-left">Ruang anonim untuk berbagi cerita dan pengakuan</p>
                    </div>
                </div>

                <!-- FORM INPUT PENGAKUAN BARU -->
                <form onsubmit="submitConfession(event)" class="mt-4 space-y-3 pt-4 text-left">
                    <div class="text-left">
                        <label for="feedAliasInput" class="sr-only">Nama atau alias (opsional)</label>
                        <input id="feedAliasInput" type="text" autocomplete="nickname" placeholder="Nama / Alias (opsional)" class="w-full bg-white/5 rounded-lg px-3 py-2 text-base sm:text-xs text-white placeholder-slate-500 focus:bg-white/10 transition text-left">
                    </div>
                    <div class="text-left">
                        <label for="feedContentInput" class="sr-only">Pengakuan atau cerita Anda</label>
                        <textarea id="feedContentInput" rows="3" maxlength="500" oninput="updateCharCounter()" placeholder="Tuliskan pengakuan atau cerita Anda..." class="w-full bg-white/5 rounded-lg p-3 text-base sm:text-xs text-white placeholder-slate-500 focus:bg-white/10 transition resize-none text-left"></textarea>
                        <div id="feedCharCounter" class="text-right text-[10px] text-slate-500 mt-1 h-3" aria-live="polite"></div>
                    </div>

                    <div class="text-left">
                        <button type="button" onclick="toggleGifInput()" class="text-[11px] text-slate-400 hover:text-white transition font-medium flex items-center gap-1">
                            <span id="gifToggleIcon" aria-hidden="true">+</span> <span id="gifToggleText">Tambah GIF</span>
                        </button>
                        <div id="gifInputContainer" class="hidden mt-2 space-y-2">
                            <label for="feedGifInput" class="sr-only">Link GIF atau gambar</label>
                            <input id="feedGifInput" type="url" oninput="handleGifPreview()" placeholder="Link GIF / Image (https://...)" class="w-full bg-white/5 rounded-lg px-3 py-2 text-base sm:text-xs text-white placeholder-slate-500 focus:bg-white/10 transition text-left">
                            <div id="gifPreviewContainer" class="hidden">
                                <div class="relative rounded-lg overflow-hidden bg-black/30 flex items-center justify-center max-h-52">
                                    <img id="gifPreviewImg" src="" alt="Preview GIF" class="max-h-52 object-contain" onerror="this.closest('#gifPreviewContainer').classList.add('hidden'); document.getElementById('gifPreviewError').classList.remove('hidden');">
                                </div>
                                <p id="gifPreviewError" class="hidden text-[10px] text-red-400 mt-1">⚠️ GIF tidak dapat dimuat — periksa kembali link-nya.</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="feedNsfwCheckbox" class="rounded bg-white/10 text-red-500 focus:ring-0 w-4 h-4 accent-red-500">
                            <span class="text-xs text-slate-400">NSFW</span>
                        </label>
                        <button type="submit" class="py-2 px-5 bg-emerald-500 hover:bg-emerald-400 text-black text-xs font-black rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-emerald-500/25 uppercase tracking-wider">
                            <span>Kirim</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- CONTROLS & FILTER -->
            <div class="flex flex-wrap items-center justify-between gap-2 text-left">
                <div class="flex gap-2">
                    <button id="filterBtnLatest" onclick="setFeedFilter('latest')" aria-pressed="true" class="px-3 py-1.5 bg-white/10 hover:bg-white/15 text-white text-xs font-medium rounded-lg transition">Terbaru</button>
                    <button id="filterBtnPopular" onclick="setFeedFilter('popular')" aria-pressed="false" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white text-xs font-medium rounded-lg transition">Populer</button>
                </div>
                <div class="flex items-center gap-2">
                    <label for="feedSearchInput" class="sr-only">Cari pengakuan</label>
                    <input id="feedSearchInput" type="text" oninput="handleFeedSearch(event)" placeholder="Cari..." class="w-24 sm:w-32 bg-white/5 rounded-lg px-3 py-1.5 text-base sm:text-xs text-white placeholder-slate-500 focus:bg-white/10 transition text-left">
                    <button id="feedRefreshBtn" onclick="fetchFeeds(); playClickSound(); triggerHaptic('light'); showToast('Feeds dimuat ulang');" aria-label="Muat ulang feeds" class="px-3 py-1.5 bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white rounded-lg text-xs transition" title="Refresh">
                        <span aria-hidden="true">🔄</span>
                    </button>
                </div>
            </div>

            <!-- FEEDS LIST CONTAINER -->
            <div id="feedsListContainer" class="text-left w-full">
                <!-- Rendered dynamically -->
            </div>

            <button id="scrollTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="Kembali ke atas" class="fixed bottom-24 right-4 z-40 w-10 h-10 rounded-full glass   bg-[#030a06]/90 backdrop-blur-xl text-emerald-300 text-sm shadow-2xl active:scale-90 transition">
                ▲
            </button>
        </div>
    </main>

    <!-- SCRIPT ENGINE LOGIC -->
    <script src="../js/feeds-data.js"></script>
    <script src="../js/core.js"></script>
    <script src="../js/feeds.js"></script>
</body>
</html>
